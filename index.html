<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#092116">
  <title>Convite | Letícia</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 22px 14px;
      background: radial-gradient(ellipse at 50% 30%, #1b4d38, #092116 65%, #04110b);
      color: #f4f7f2;
      font-family: Georgia, serif;
    }

    main {
      width: min(100%, 420px);
      text-align: center;
    }

    .eyebrow {
      font: 11px Arial, sans-serif;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: #dfbe78;
      opacity: 0;
      animation: fadeUp 0.8s ease forwards;
    }

    h1 {
      font-size: 40px;
      letter-spacing: .1em;
      font-weight: normal;
      margin: 12px 0 5px;
      color: #fffdf7;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .sub {
      color: #c5d6cc;
      letter-spacing: .08em;
      margin-bottom: 22px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }

    .scene {
      height: 270px;
      position: relative;
      perspective: 1000px;
      transition: height .8s ease;
    }

    /* Envelope Verde Esmeralda Escuro */
    .envelope {
      position: absolute;
      left: 50%;
      bottom: 10px;
      transform: translateX(-50%);
      width: min(100%, 350px);
      height: 218px;
      background: linear-gradient(145deg, #194d38, #0c2b1e);
      border: 1px solid #d4af66;
      border-radius: 5px;
      box-shadow: 0 20px 45px rgba(0, 0, 0, 0.65);
      cursor: pointer;
      z-index: 3;
    }

    .envelope:before {
      content: "";
      position: absolute;
      inset: 0;
      background: 
        linear-gradient(34deg, transparent 49.5%, #27664c 50%, transparent 50.5%),
        linear-gradient(-34deg, transparent 49.5%, #123b2a 50%, transparent 50.5%);
    }

    .flap {
      position: absolute;
      inset: 0 0 auto;
      height: 125px;
      transform-origin: top;
      background: linear-gradient(160deg, #215e45, #0f3324);
      clip-path: polygon(0 0, 100% 0, 50% 100%);
      border-top: 1px solid #d4af66;
      transition: transform .9s ease;
      z-index: 4;
    }

      z-index: 5;

      place-items: center;
